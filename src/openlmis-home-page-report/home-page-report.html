<div class="home-page-report-panel">
    <!--
      MALAWISUP-7386 - TEMPORARY OVERRIDE of openlmis-referencedata-ui.
      Copied verbatim from openlmis/referencedata-ui:5.6.20-SNAPSHOT; mw-ui stays pinned to the released 5.6.19.
      Upstream fix: MW-1449 (2248c7ba).
      DELETE THIS FILE once docker-compose.yml pins openlmis/referencedata-ui >= 5.6.20.
      NOTE: keep this comment inside the root element - a leading comment makes node [0]
      of the compiled template a comment node, so openlmisModalService finds no scope
      and $onInit never runs.
    -->
    <p ng-if="vm.error" class="alert alert-danger">{{ vm.error }}</p>

    <!-- ng-show, not ng-if: keep the SDK mount point in the DOM before embedDashboard() runs. -->
    <div
        ng-show="vm.isEmbedded && vm.isReady"
        id="home-page-superset-embed-container"
        class="home-page-superset-embed-container">
    </div>

    <!-- Non-Superset reports and legacy Superset OAuth iframe -->
    <iframe
        ng-if="!vm.isEmbedded && vm.isAuthorized"
        title="home_page_report"
        style="width: 95vw; height: 90vh"
        src="{{ vm.report.url }}"
        frameborder="0"
        scrolling="auto"
        allowFullScreen="true">
    </iframe>
</div>
